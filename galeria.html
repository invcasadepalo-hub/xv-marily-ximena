<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eef3fa">
<title>Galería ovalada</title>
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: transparent;
}

.marco-oval {
  width: min(78vw, 310px);
  aspect-ratio: 0.72;
  position: relative;
  border-radius: 50% / 43%;
  border: 2px solid #A6A6A6;
  outline: 1px solid #9EBCDF;
  outline-offset: 6px;
  overflow: hidden;
  background: #eaf0f7;
  box-shadow: 0 10px 28px rgba(100,120,145,0.16);
}

.fotografias {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: inherit;
}

.foto {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  opacity: 0;
  transform: scale(1);
  transition: opacity 700ms ease;
}

.foto.activa {
  opacity: 1;
  animation: acercamiento 3s ease-out forwards;
}

@keyframes acercamiento {
  from { transform: scale(1); }
  to   { transform: scale(1.22); }
}

@media (prefers-reduced-motion: reduce) {
  .foto.activa { animation: none; }
}
</style>
</head>
<body>

<div class="marco-oval">
  <div class="fotografias">
    <!-- Sube las cuatro fotos JPEG junto a este archivo:
         foto1.jpeg, foto2.jpeg, foto3.jpeg y foto4.jpeg -->
    <img class="foto activa" src="foto1.jpeg" alt="Fotografía 1">
    <img class="foto" src="foto2.jpeg" alt="Fotografía 2">
    <img class="foto" src="foto3.jpeg" alt="Fotografía 3">
    <img class="foto" src="foto4.jpeg" alt="Fotografía 4">
  </div>
</div>

<script>
(() => {
  const fotos = Array.from(document.querySelectorAll(".foto"));
  let actual = 0;

  // Cambia cada 3 segundos y acerca cada fotografía hacia la pantalla.
  window.setInterval(() => {
    fotos[actual].classList.remove("activa");
    actual = (actual + 1) % fotos.length;

    // Reinicia la animación de zoom en la siguiente fotografía.
    void fotos[actual].offsetWidth;
    fotos[actual].classList.add("activa");
  }, 3000);
})();
</script>

</body>
</html>
